>

        <svg
          fill="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            clip-rule="evenodd"
            d="M12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2ZM12 4C16.4183 4 20 7.58172 20 12C20 16.4183 16.4183 20 12 20C7.58172 20 4 16.4183 4 12C4 7.58172 7.58172 4 12 4Z"

      <a
        class="text-sm font-medium text-primary hover:text-primary transition-colors"
        href="#"

      >
      <a
        class="text-sm font-medium text-[var(--text-foreground)] hover:text-[var(--primary-color)] transition-colors"

    >

        height="20"
        viewBox="0 0 256 256"
        width="20"
        xmlns="http://www.w3.org/2000/svg"

</header>

<aside
  class="fixed bottom-0 z-50 w-full bg-white flex items-center px-2 justify-between shadow-sidebar h-15 sm:hidden"
>
  <nav class="w-full flex justify-between items-center">
    <a
      routerLink="home"
      routerLinkActive="text-primary"
      class="relative group flex items-center flex-col rounded-main text-muted-foreground font-light sidebar-font-scale"
    >
      <span class="material-icons sidebar-font-scale">space_dashboard</span>
      <span>Home</span>
    </a>
    <a
      routerLink="student"
      routerLinkActive="text-primary"
      class="relative group flex items-center flex-col rounded-main text-muted-foreground font-light sidebar-font-scale"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-6 h-6 mb-0.5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 3h7v7H3V3zM14 3h7v4h-7V3zM14 10h7v11h-7V10zM3 14h7v7H3v-7z"
        />
      </svg>
      <span>Dashboard</span>
    </a>
    <a
      routerLink="teacher"
      routerLinkActive="text-primary"
      class="relative group flex items-center flex-col rounded-main text-muted-foreground font-light sidebar-font-scale"
    >
      <span class="material-icons sidebar-font-scale">school</span>
      <span>Teachers</span>
    </a>
  </nav>
</aside>
