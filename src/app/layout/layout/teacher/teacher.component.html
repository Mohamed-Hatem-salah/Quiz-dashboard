<div class="p-4 sm:p-6 space-y-4">
  <!-- Main header with Add teacher button -->
  <div class="flex justify-between items-center gap-3 mb-6">
  <h1 class="text-3xl font-bold">Teachers</h1>
  <button
    (click)="openAddModal()"
    class="bg-blue-600 hover:bg-blue-500 text-white gap-2 font-medium py-2 px-4 duration-200 rounded-lg shadow-md flex items-center"
  >
    <span class="material-symbols-outlined"> add </span>
    Add teacher
  </button>
</div>

  
  <div class="bg-white rounded-lg shadow p-4">
    <h2 class="text-lg font-medium">Teacher Management</h2>

    <!-- Search bar -->
    <div class="relative mb-6">
      <input type="text" 
             [(ngModel)]="searchTerm"
             (input)="filterTeachers()"
             placeholder="Search teachers..." 
             class="w-full p-2 pl-8 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      <svg class="absolute left-2 top-3 h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
    </div>

    <!-- teachers table -->
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Subject</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let teacher of filteredTeachers" class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap font-medium">{{teacher.name}}</td>
            <td class="px-6 py-4 whitespace-nowrap">{{teacher.email}}</td>
            <td class="px-6 py-4 whitespace-nowrap">{{teacher.subject}}</td>
            <td class="px-6 py-4 whitespace-nowrap">{{teacher.phone || '-'}}</td>
            <td class="px-6 py-4 whitespace-nowrap flex space-x-2">
              <!-- Edit button -->
              <button (click)="editTeacher(teacher)" class="text-black-600 duration-200 hover:text-blue-500" title="Edit">
                <span class="material-symbols-outlined">
                  edit_document
                </span>
              </button>
              
              <!-- Delete button -->
              <button (click)="deleteTeacher(teacher.id)" class="text-red-600 duration-200 hover:text-blue-500" title="Delete">
                <span class="material-symbols-outlined">
                  delete
                </span>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add/Edit teacher Modal -->
  <div *ngIf="showModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
      <div class="border-b px-6 py-4 flex justify-between items-center">
        <h3 class="text-lg font-medium">{{isEditMode ? 'Edit teacher' : 'Add teacher'}}</h3>
        <button (click)="closeModal()" class="text-gray-500 hover:text-gray-700">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="p-6">
        <form (ngSubmit)="isEditMode ? updateTeacher() : addTeacher()">
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-medium mb-2">Name</label>
            <input type="text" [(ngModel)]="currentTeacher.name" name="name" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-medium mb-2">Email</label>
            <input type="email" [(ngModel)]="currentTeacher.email" name="email" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-medium mb-2">Subject</label>
            <input type="text" [(ngModel)]="currentTeacher.subject" name="subject" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="mb-6">
            <label class="block text-gray-700 text-sm font-medium mb-2">Phone (Optional)</label>
            <input type="text" [(ngModel)]="currentTeacher.phone" name="phone"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="flex justify-end space-x-3">
            <button type="button" (click)="closeModal()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
              {{isEditMode ? 'Update' : 'Save'}}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Success Notification -->
  <div *ngIf="showSuccessAlert" class="fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-md shadow-lg flex items-center z-50">
    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
    </svg>
    Teacher {{isEditMode ? 'updated' : 'created'}} successfully!
  </div>
</div>
