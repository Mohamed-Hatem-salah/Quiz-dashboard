<header class="gradient-card border-b border-gray-200 sticky top-0">
  <div class="flex items-center justify-between py-4 px-8">
    <div class="flex items-center space-x-4">
      <!-- Search input -->
      <div class="relative w-90 max-w-xs">
        <!-- Search SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"
          fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
        </svg>
        <input
          class="pl-10 pr-4 py-2 w-full bg-gray-100 border border-transparent rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Search students, teachers, quizzes..." type="text" />
      </div>
    </div>

    <!-- Notifications and user -->
    <div class="flex items-center space-x-6">
      <!-- Notifications -->
      <div class="relative">
        <button class="text-gray-500">
          <!-- Bell SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1h6z" />
          </svg>
        </button>
        <span
          class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-xs font-bold text-white">
          3
        </span>
      </div>

      <!-- User info -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center">
          <!-- User  -->
          <span class="material-symbols-outlined text-white">
            person
          </span>
        </div>
        <div>
          <p class="font-semibold text-gray-800">Super Admin</p>
          <p class="text-sm text-gray-500">adminquiz.app</p>
        </div>
      </div>
    </div>
  </div>
</header>
